<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --navy:#0B1E3F; --navy-deep:#061330;
    --brew-gold:#FFC52F; --rays-blue:#8FBCE6;
    --cream:#FFF8E7; --ink:#0A1430;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1080px;overflow:hidden;background:var(--navy)}
  body{font-family:"Inter Display","Inter",system-ui,sans-serif;color:var(--cream);position:relative}

  .bg{position:absolute;inset:0;background:
      radial-gradient(900px 700px at 50% 20%, #152b5c 0%, var(--navy) 55%, var(--navy-deep) 100%);}
  .sweep-l{position:absolute;left:-220px;top:-120px;width:760px;height:1400px;
      background:linear-gradient(180deg,var(--brew-gold),#e2a800);transform:rotate(14deg);opacity:.14;filter:blur(2px)}
  .sweep-r{position:absolute;right:-220px;top:-120px;width:760px;height:1400px;
      background:linear-gradient(180deg,var(--rays-blue),#4f8fd0);transform:rotate(-14deg);opacity:.16;filter:blur(2px)}

  .grid-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);width:1500px;height:1500px;opacity:.13}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);width:100%;height:100%}
  .grid div{border:1.5px solid var(--cream)}
  .grid .on{background:var(--cream);opacity:.55}

  .content{position:absolute;inset:0;padding:78px 84px;display:flex;flex-direction:column;justify-content:space-between}

  .mini{position:absolute;right:84px;top:78px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:144px;height:144px}
  .mini div{border:3px solid rgba(255,248,231,.55);border-radius:6px;display:flex;align-items:center;justify-content:center;
      font-weight:900;font-size:17px;color:var(--cream)}
  .mini .g{background:var(--brew-gold);color:#12284B;border-color:var(--brew-gold)}
  .mini .b{background:var(--rays-blue);color:#092C5C;border-color:var(--rays-blue)}
  .mini .w{background:var(--cream);color:var(--ink);border-color:var(--cream)}

  .kicker{display:inline-flex;align-items:center;gap:14px;font-weight:700;font-size:26px;letter-spacing:.22em;text-transform:uppercase;color:var(--brew-gold);white-space:nowrap}
  .kicker .dot{width:14px;height:14px;border-radius:50%;background:#ff4b4b;box-shadow:0 0 0 6px rgba(255,75,75,.25);flex:none}

  h1{font-weight:900;line-height:.86;letter-spacing:-.045em;text-transform:uppercase;margin-top:28px}
  h1 .thin{display:block;font-size:92px;letter-spacing:-.02em;opacity:.92;margin-bottom:10px}
  h1 .big{display:block;font-size:168px;text-shadow:0 10px 40px rgba(0,0,0,.45)}

  .matchup{display:flex;align-items:center;gap:22px;margin-top:40px}
  .team{font-weight:900;font-size:64px;letter-spacing:-.02em;text-transform:uppercase;padding:10px 26px;border-radius:14px;line-height:1}
  .team.brew{background:var(--brew-gold);color:#12284B}
  .team.rays{background:var(--rays-blue);color:#092C5C}
  .vs{font-weight:800;font-size:34px;letter-spacing:.2em;opacity:.7}

  .when{margin-top:26px;font-weight:600;font-size:31px;white-space:nowrap;opacity:.9}
  .when b{font-weight:900;color:var(--brew-gold)}

  .steps{display:flex;gap:16px;margin-top:44px}
  .steps div{display:flex;align-items:center;gap:12px;font-weight:700;font-size:24px;padding:14px 22px 14px 14px;border-radius:999px;
      background:rgba(255,248,231,.08);border:2px solid rgba(255,248,231,.22);white-space:nowrap}
  .steps span{width:38px;height:38px;border-radius:50%;background:var(--brew-gold);color:#12284B;font-weight:900;font-size:20px;
      display:flex;align-items:center;justify-content:center;flex:none}

  .cta{background:var(--cream);color:var(--ink);font-weight:900;font-size:36px;white-space:nowrap;letter-spacing:-.01em;
      padding:26px 40px;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:space-between;gap:30px}
  .cta small{display:block;font-weight:700;font-size:22px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
  .cta .arrow{font-size:44px;font-weight:900;opacity:.35}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="sweep-l"></div>
  <div class="sweep-r"></div>
  <div class="grid-wrap"><div class="grid" id="grid"></div></div>

  <div class="content">
    <div class="mini">
      <div class="g">JM</div><div></div><div class="b">AR</div><div></div>
      <div></div><div class="w">TK</div><div></div><div class="g">LS</div>
      <div class="b">DP</div><div></div><div></div><div class="w">RJ</div>
      <div></div><div class="g">MC</div><div class="b">EB</div><div></div>
    </div>

    <div>
      <div class="kicker">Game 1 is tonight</div>
      <h1>
        <span class="thin">World Series</span>
        <span class="big">Squares</span>
      </h1>
      <div class="matchup">
        <span class="team brew">Brewers</span>
        <span class="vs">VS</span>
        <span class="team rays">Rays</span>
      </div>
      <div class="when">First pitch <b>tonight, Fri Oct 23</b>: grab your squares before it starts.</div>
      <div class="steps">
        <div><span>1</span>Pick your squares</div>
        <div><span>2</span>Numbers get drawn</div>
        <div><span>3</span>Win every inning</div>
      </div>
    </div>

    <div class="cta">
      <div><small>Run your pool free</small>superbowlpoolsite.com/world-series-pool</div>
      <div class="arrow">→</div>
    </div>
  </div>

<script>
  const g=document.getElementById('grid');
  const on=new Set([3,7,12,18,21,27,33,38,44,49,52,58,61,66,73,79,84,88,91,97]);
  for(let i=0;i<100;i++){const d=document.createElement('div');if(on.has(i))d.className='on';g.appendChild(d);}
</script>
</body>
</html>
